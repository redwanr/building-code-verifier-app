        - {found: stair_tread_mm, limit: 225, direction: min, action: "Deepen the tread by {gap} to at least {limit}."}
        - {found: "stair_riser_mm + stair_tread_mm", label: "Riser + tread", limit: 400, direction: min, format: stair_riser_mm, action: "Increase riser + tread by {gap} to at least {limit}."}

