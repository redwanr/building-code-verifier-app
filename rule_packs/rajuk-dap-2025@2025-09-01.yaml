    severity: Critical
    confidence_basis: "Verbatim Appendix-1 Table-4 Note (2) (page image, PDF p.98 / gazette p.13506): '৬ তলার অধিক উচ্চতা বিশিষ্ট আবাসিক (A-2, A3, A-4, A-5) ইমারতে একটি মাত্র সিঁড়ি থাকিলে উক্ত সিঁড়িটি অগ্নি নিরাপদ সিঁড়ি হইতে হইবে' (a residential building over 6 storeys with only one stair: that stair must be fire-safe). The fire-safe stair is read as has_fire_rated_stair_enclosure. [VERIFY]: unsigned; G-2."
