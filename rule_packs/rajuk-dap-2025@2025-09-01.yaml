  - id: RAJUK-TOILET-020
    title: "Toilet at least 1.2 m2 and 1 m wide (Bidhimala Rule 57(c))"
    parameters: [toilet_area_m2, toilet_width_m]
    logic: "toilet_area_m2 >= 1.2 and toilet_width_m >= 1"
    severity: Medium
    confidence_basis: "Verbatim Rule 57(c)(2) (page image, PDF p.72 / gazette p.13480): 'বেসিন ও ওয়াটার ক্লোজেট সংবলিত টয়লেটের ক্ষেত্রে ন্যূনতম ফ্লোর এরিয়া ১.২ বর্গমিটার এবং ন্যূনতম প্রস্থ ১ মিটার হইবে'; 57(c)(5) (p.13481) gives the same 1.2 m2 / 1 m for a WC only. Those are the smallest of the five toilet types, so they are checked against the smallest labelled toilet. Toilets with a bathing space need more (WC + bath 2.8 m2 / 1 m; basin + WC + bath 3.0 m2 / 1.25 m; basin + bath 1.5 m2 / 1 m), but fixtures are not reliably readable from a label, so those minimums are not encoded. [VERIFY]"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 57(c)(2),(5)"
