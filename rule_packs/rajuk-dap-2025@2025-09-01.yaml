# RAJUK DAP/Bidhimala planning rule pack (FAR, MGC, setbacks, parking, lifts).
# Primary source: Imarat Nirman Bidhimala 2025 (Bangladesh Gazette 2025-12-14)
# + RAJUK DAP 2022-2035. All quotes + derivations:
# docs/new_features/nirman-traceability.md (source text:
# docs/new_features/bidhimala-dap-text.md, Gemini-OCR'd Bengali — hence every
# numeric rule below keeps verify_flag: true until the domain expert confirms
# the digits against the gazette scan).
# User-supplied values (permissible_far, allowable_mgc_pct, required setbacks,
# parking_required) stay ward/plan-specific at the confirmation gate; the *B /
# numbered sourced rules cross-check against the gazette tables directly.
jurisdiction: rajuk-dap-2025
effective_date: "2025-09-01"
source: RAJUK-DAP/Bidhimala

rules:
  - id: RAJUK-FAR-003-LIMIT
    title: Claimed FAR within permissible FAR
    parameters: [claimed_far, permissible_far]
    logic: "claimed_far <= permissible_far"
    severity: High
    confidence_basis: "Principle sourced (Bidhimala 2025 Rule 47(3): base FAR = smaller of area-based and road-based FAR, binding); permissible value is plot-specific (DAP density block + incentives) and user-supplied [VERIFY]"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 47 + DAP 2022-2035 density-block FAR"
    remediation: "Verify claimed FAR against the plot's DAP density-block FAR and road-based FAR (Rule 47, Table-5)."
    verify_flag: true
    display:
      kind: compare
      fix_on: layout_far_sheet
      headline_fail: "FAR is above the allowed limit"
      headline_pass: "FAR appears to be within the allowed limit"
      action: "Reduce FAR by {gap} to {limit}[[ (about {gap_area} of FAR-included floor area)]]."
      rows:
        - {found: claimed_far, limit: permissible_far, direction: max}

  - id: RAJUK-FAR-003-CONSISTENCY
    title: Claimed FAR consistent with floor-area / plot-area math
    parameters: [claimed_far, total_floor_area_m2, plot_area_m2]
    logic: "consistency([claimed_far, total_floor_area_m2 / plot_area_m2])"
    severity: High
    confidence_basis: "Internal arithmetic consistency per the gazette's own formula (Bidhimala 2025 definition (81)); no external threshold. FAR-exempt areas (Rule 49) may explain small gaps — tolerance 5%."
    citation: "Imarat Nirman Bidhimala 2025 definition (81) — FAR = total floor area / plot area (exempt areas per Rule 49 excluded)"
    remediation: "Reconcile the FAR figure with total floor area / plot area on the sheet (check Rule 49 exemptions)."
    verify_flag: false
    display:
      kind: consistency
      fix_on: layout_far_sheet
      headline_fail: "Values on the sheet disagree"
      headline_pass: "FAR and floor area appear to agree"
      action: "Make the FAR agree with the total area including FAR divided by the plot area."
      tolerance: 0.05
      values:
        - {expr: claimed_far, label: "FAR as stated"}
        - {expr: "total_floor_area_m2 / plot_area_m2", label: "Total area including FAR ÷ plot area", format: claimed_far}

  - id: RAJUK-MGC-004
    title: Ground coverage (MGC) within allowable (user-supplied)
    parameters: [claimed_mgc_pct, allowable_mgc_pct]
    logic: "claimed_mgc_pct <= allowable_mgc_pct"
    severity: High
    confidence_basis: "Principle sourced (Bidhimala 2025 Rule 45(1), Table-3); allowable % user-supplied at the gate [VERIFY] — see RAJUK-MGC-004B for the direct table check"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 45(1), Table-3 (Maximum Ground Coverage by plot size)"
    remediation: "Reduce footprint or confirm plot bracket; reconcile MGC with allowable."
    verify_flag: true
    display:
      kind: compare
      fix_on: layout_far_sheet
      headline_fail: "Ground coverage is above the allowed maximum"
      headline_pass: "Ground coverage appears to be within the allowed maximum"
      action: "Reduce ground coverage by {gap} to {limit}."
      rows:
        - {found: claimed_mgc_pct, limit: allowable_mgc_pct, direction: max}

  - id: RAJUK-MGC-004B
    title: Ground coverage (MGC) vs Bidhimala Table-3 plot-size bracket
    parameters: [claimed_mgc_pct, plot_area_m2]
    logic: "(plot_area_m2 > 134 or claimed_mgc_pct <= 70) and (plot_area_m2 <= 134 or plot_area_m2 > 201 or claimed_mgc_pct <= 67.5) and (plot_area_m2 <= 201 or plot_area_m2 > 268 or claimed_mgc_pct <= 65) and (plot_area_m2 <= 268 or plot_area_m2 > 402 or claimed_mgc_pct <= 62.5) and (plot_area_m2 <= 402 or plot_area_m2 > 670 or claimed_mgc_pct <= 60) and (plot_area_m2 <= 670 or plot_area_m2 > 937 or claimed_mgc_pct <= 55) and (plot_area_m2 <= 937 or plot_area_m2 > 1339 or claimed_mgc_pct <= 50) and (plot_area_m2 <= 1339 or plot_area_m2 > 2677 or claimed_mgc_pct <= 45) and (plot_area_m2 <= 2677 or claimed_mgc_pct <= 40)"
    severity: High
    confidence_basis: "Brackets verbatim from Table-3 (max MGC 70/67.5/65/62.5/60/55/50/45/40% by plot size); [VERIFY] OCR'd gazette digits + Table-3 exceptions (extra paved coverage col-6, A6 affordable housing 75%, road-surrender exclusions) not encoded"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 45(1), Table-3"
    remediation: "Reduce ground coverage to the Table-3 maximum for the plot-size bracket, or document an applicable Table-3/Table-4 exception."
    verify_flag: true
    display:
      kind: compare
      fix_on: layout_far_sheet
      headline_fail: "Ground coverage is above the maximum for this plot size"
      headline_pass: "Ground coverage appears to be within the maximum for this plot size"
      action: "Reduce ground coverage by {gap} to {limit}."
      rows:
        - {found: claimed_mgc_pct, limit: 70, direction: max, when: "plot_area_m2 <= 134"}
        - {found: claimed_mgc_pct, limit: 67.5, direction: max, when: "plot_area_m2 > 134 and plot_area_m2 <= 201"}
        - {found: claimed_mgc_pct, limit: 65, direction: max, when: "plot_area_m2 > 201 and plot_area_m2 <= 268"}
        - {found: claimed_mgc_pct, limit: 62.5, direction: max, when: "plot_area_m2 > 268 and plot_area_m2 <= 402"}
        - {found: claimed_mgc_pct, limit: 60, direction: max, when: "plot_area_m2 > 402 and plot_area_m2 <= 670"}
        - {found: claimed_mgc_pct, limit: 55, direction: max, when: "plot_area_m2 > 670 and plot_area_m2 <= 937"}
        - {found: claimed_mgc_pct, limit: 50, direction: max, when: "plot_area_m2 > 937 and plot_area_m2 <= 1339"}
        - {found: claimed_mgc_pct, limit: 45, direction: max, when: "plot_area_m2 > 1339 and plot_area_m2 <= 2677"}
        - {found: claimed_mgc_pct, limit: 40, direction: max, when: "plot_area_m2 > 2677"}

  - id: RAJUK-SETBACK-005
    title: Setbacks (front/rear/side) vs required schedule (user-supplied)
    parameters: [front_setback_m, rear_setback_m, side_setback_m,
                 required_front_setback_m, required_rear_setback_m, required_side_setback_m]
    logic: "front_setback_m >= required_front_setback_m and rear_setback_m >= required_rear_setback_m and side_setback_m >= required_side_setback_m"
    severity: High
    confidence_basis: "Principle sourced (Bidhimala 2025 Rule 41, Table-1); required values user-supplied for plan/ward specifics [VERIFY] — see RAJUK-SETBACK-005B for the direct table check"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 41 + Table-1 (minimum setbacks by storey count)"
    remediation: "Confirm setbacks meet Rule 41/Table-1 for this storey count and plot situation."
    verify_flag: true
    display:
      kind: compare
      fix_on: layout_far_sheet
      headline_fail: "A setback is smaller than required"
      headline_pass: "Setbacks appear to be at least the required size"
      rows:
        - {found: front_setback_m, limit: required_front_setback_m, direction: min, action: "Increase the front setback by {gap} to {limit}."}
        - {found: rear_setback_m, limit: required_rear_setback_m, direction: min, action: "Increase the rear setback by {gap} to {limit}."}
        - {found: side_setback_m, limit: required_side_setback_m, direction: min, action: "Increase the side setback by {gap} to {limit}."}

  - id: RAJUK-SETBACK-005B
    title: Setbacks vs Bidhimala Table-1 storey bands
    parameters: [num_storeys, front_setback_m, side_setback_m, rear_setback_m]
    logic: "front_setback_m >= 1.5 and (num_storeys > 7 or (side_setback_m >= 1.0 and rear_setback_m >= 1.25)) and (num_storeys <= 7 or num_storeys > 10 or (side_setback_m >= 1.25 and rear_setback_m >= 2.0)) and (num_storeys <= 10 or num_storeys > 15 or (side_setback_m >= 3.0 and rear_setback_m >= 3.0)) and (num_storeys <= 15 or num_storeys > 20 or (side_setback_m >= 3.25 and rear_setback_m >= 3.25)) and (num_storeys <= 20 or num_storeys > 30 or (side_setback_m >= 3.5 and rear_setback_m >= 3.5)) and (num_storeys <= 30 or num_storeys > 40 or (side_setback_m >= 4.5 and rear_setback_m >= 4.5)) and (num_storeys <= 40 or (side_setback_m >= 5.0 and rear_setback_m >= 5.0))"
    severity: High
    confidence_basis: "Side/rear bands verbatim from Table-1; front >= 1.5 m from boundary per Rule 41(1) (the alternative 4.5 m-from-road-centre branch is not sheet-readable). [VERIFY] OCR'd gazette digits + Rule 41(1) road-centre condition + Table-2 exceptions not encoded"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 41(1),(3), Table-1"
    remediation: "Increase side/rear setbacks to the Table-1 minimum for the storey band; keep front setback >= 1.5 m from the boundary (and >= 4.5 m from the road centre-line)."
    verify_flag: true
    display:
      kind: compare
      fix_on: layout_far_sheet
      headline_fail: "A setback is smaller than the minimum for this number of storeys"
      headline_pass: "Setbacks appear to be at least the minimum for this number of storeys"
      rows:
        - {found: front_setback_m, limit: 1.5, direction: min, action: "Increase the front setback by {gap} to {limit}."}
        - {found: side_setback_m, limit: 1.0, direction: min, when: "num_storeys <= 7", action: "Increase the side setback by {gap} to {limit}."}
        - {found: rear_setback_m, limit: 1.25, direction: min, when: "num_storeys <= 7", action: "Increase the rear setback by {gap} to {limit}."}
        - {found: side_setback_m, limit: 1.25, direction: min, when: "num_storeys > 7 and num_storeys <= 10", action: "Increase the side setback by {gap} to {limit}."}
        - {found: rear_setback_m, limit: 2.0, direction: min, when: "num_storeys > 7 and num_storeys <= 10", action: "Increase the rear setback by {gap} to {limit}."}
        - {found: side_setback_m, limit: 3.0, direction: min, when: "num_storeys > 10 and num_storeys <= 15", action: "Increase the side setback by {gap} to {limit}."}
        - {found: rear_setback_m, limit: 3.0, direction: min, when: "num_storeys > 10 and num_storeys <= 15", action: "Increase the rear setback by {gap} to {limit}."}
        - {found: side_setback_m, limit: 3.25, direction: min, when: "num_storeys > 15 and num_storeys <= 20", action: "Increase the side setback by {gap} to {limit}."}
        - {found: rear_setback_m, limit: 3.25, direction: min, when: "num_storeys > 15 and num_storeys <= 20", action: "Increase the rear setback by {gap} to {limit}."}
        - {found: side_setback_m, limit: 3.5, direction: min, when: "num_storeys > 20 and num_storeys <= 30", action: "Increase the side setback by {gap} to {limit}."}
        - {found: rear_setback_m, limit: 3.5, direction: min, when: "num_storeys > 20 and num_storeys <= 30", action: "Increase the rear setback by {gap} to {limit}."}
        - {found: side_setback_m, limit: 4.5, direction: min, when: "num_storeys > 30 and num_storeys <= 40", action: "Increase the side setback by {gap} to {limit}."}
        - {found: rear_setback_m, limit: 4.5, direction: min, when: "num_storeys > 30 and num_storeys <= 40", action: "Increase the rear setback by {gap} to {limit}."}
        - {found: side_setback_m, limit: 5.0, direction: min, when: "num_storeys > 40", action: "Increase the side setback by {gap} to {limit}."}
        - {found: rear_setback_m, limit: 5.0, direction: min, when: "num_storeys > 40", action: "Increase the rear setback by {gap} to {limit}."}

  - id: RAJUK-PARKING-006-RATIO
    title: Parking provided meets required count (user-supplied)
    parameters: [parking_provided, parking_required]
    logic: "parking_provided >= ceil(parking_required)"
    severity: Medium
    confidence_basis: "Principle sourced (Bidhimala 2025 Rule 53(5), Table-8); a fractional required count rounds up to a whole space (Table-8 Note 3); required count user-supplied for the actual unit mix [VERIFY] — see RAJUK-PARKING-012 for the direct slab check"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 53(5), Table-8 (minimum parking by occupancy)"
    remediation: "Reconcile required vs provided parking for the unit mix."
    verify_flag: true
    display:
      kind: compare
      fix_on: ground_floor
      headline_fail: "Parking provided is below the count required"
      headline_pass: "Parking provided appears to meet the count required"
      action: "Provide {gap} more parking spaces, to at least {limit}."
      rows:
        - {found: parking_provided, limit: "ceil(parking_required)", direction: min}

  - id: RAJUK-PARKING-006-CONSISTENCY
    title: Parking table consistent with count shown on plan
    parameters: [parking_provided_table, parking_count_on_plan]
    logic: "consistency([parking_provided_table, parking_count_on_plan], 0.0)"
    severity: Medium
    confidence_basis: "Internal consistency — rule-independent, no external threshold"
    citation: "RAJUK submission data table vs plan — parking count reconciliation"
    remediation: "Fix the mismatch between the parking table and the count shown on plan."
    verify_flag: false
    display:
      kind: consistency
      fix_on: ground_floor
      headline_fail: "Values on the sheet disagree"
      headline_pass: "Parking table and plan appear to agree"
      action: "Make the parking table and the plan show the same number of spaces."
      tolerance: 0.0
      values:
        - {expr: parking_provided_table, label: "Parking in the table"}
        - {expr: parking_count_on_plan, label: "Parking drawn on the plan"}

  - id: RAJUK-FAR-ROADBAND-011
    title: Claimed FAR vs road-width FAR index (A3 flats, Table-5)
    parameters: [claimed_far, road_width_m, area_class]
    logic: "(area_class != 'dhaka_core' or ((road_width_m < 1.8 or road_width_m >= 2.5 or claimed_far <= 1.25) and (road_width_m < 2.5 or road_width_m >= 3.66 or claimed_far <= 1.75) and (road_width_m < 3.66 or road_width_m >= 4.88 or claimed_far <= 2) and (road_width_m < 4.88 or road_width_m >= 6 or claimed_far <= 2.25 + (road_width_m - 4.88) * (3.25 - 2.25) / (6 - 4.88)) and (road_width_m < 6 or road_width_m >= 9 or claimed_far <= 3.25 + (road_width_m - 6) * (3.5 - 3.25) / (9 - 6)) and (road_width_m < 9 or road_width_m >= 12 or claimed_far <= 3.5 + (road_width_m - 9) * (4 - 3.5) / (12 - 9)) and (road_width_m < 12 or road_width_m >= 18 or claimed_far <= 4 + (road_width_m - 12) * (4.25 - 4) / (18 - 12)) and (road_width_m < 18 or road_width_m >= 24 or claimed_far <= 4.25 + (road_width_m - 18) * (4.75 - 4.25) / (24 - 18)) and (road_width_m < 24 or claimed_far <= 4.75))) and (area_class != 'outer_urban' or ((road_width_m < 1.8 or road_width_m >= 2.5 or claimed_far <= 1.25) and (road_width_m < 2.5 or road_width_m >= 3.66 or claimed_far <= 1.5) and (road_width_m < 3.66 or road_width_m >= 4.88 or claimed_far <= 1.75) and (road_width_m < 4.88 or road_width_m >= 6 or claimed_far <= 2 + (road_width_m - 4.88) * (2.5 - 2) / (6 - 4.88)) and (road_width_m < 6 or road_width_m >= 9 or claimed_far <= 2.5 + (road_width_m - 6) * (3 - 2.5) / (9 - 6)) and (road_width_m < 9 or road_width_m >= 12 or claimed_far <= 3 + (road_width_m - 9) * (3.5 - 3) / (12 - 9)) and (road_width_m < 12 or road_width_m >= 18 or claimed_far <= 3.5 + (road_width_m - 12) * (3.75 - 3.5) / (18 - 12)) and (road_width_m < 18 or road_width_m >= 24 or claimed_far <= 3.75 + (road_width_m - 18) * (4.25 - 3.75) / (24 - 18)) and (road_width_m < 24 or claimed_far <= 4.25))) and (area_class != 'other' or ((road_width_m < 1.8 or road_width_m >= 2.5 or claimed_far <= 1) and (road_width_m < 2.5 or road_width_m >= 3.66 or claimed_far <= 1.25) and (road_width_m < 3.66 or road_width_m >= 4.88 or claimed_far <= 1.5) and (road_width_m < 4.88 or road_width_m >= 6 or claimed_far <= 1.75 + (road_width_m - 4.88) * (2.3 - 1.75) / (6 - 4.88)) and (road_width_m < 6 or road_width_m >= 9 or claimed_far <= 2.3 + (road_width_m - 6) * (2.8 - 2.3) / (9 - 6)) and (road_width_m < 9 or road_width_m >= 12 or claimed_far <= 2.8 + (road_width_m - 9) * (3.3 - 2.8) / (12 - 9)) and (road_width_m < 12 or road_width_m >= 18 or claimed_far <= 3.3 + (road_width_m - 12) * (3.5 - 3.3) / (18 - 12)) and (road_width_m < 18 or road_width_m >= 24 or claimed_far <= 3.5 + (road_width_m - 18) * (4 - 3.5) / (24 - 18)) and (road_width_m < 24 or claimed_far <= 4)))"
    severity: High
    confidence_basis: "A3 row of Table-5 verbatim for all three area classes (dhaka_core / outer_urban / other). [VERIFY]: OCR'd gazette digits; Rule 47(3) allows exceeding road-FAR with DAP incentives up to max FAR; Rule 47(6) (page image, PDF p.57 / gazette p.13465): 'বিদ্যমান রাস্তাটি বর্ণিত ধাপ অপেক্ষা প্রশস্ত হইলে রাস্তার অতিরিক্ত প্রশস্ততার উপর ভিত্তি করিয়া FAR নির্ধারিত হইবে এবং উক্ত বৃদ্ধির পরিমাণ রাস্তার প্রশস্ততা অনুযায়ী পরবর্তী ধাপের FAR সূচক পর্যন্ত সমানুপাতিক হারে বৃদ্ধি পাইবে' — above a single-value step (4.88 m and up) the limit rises linearly to the next step's value; the three range columns (1.8-<2.5, 2.5-<3.66, 3.66-<4.88) stay flat; 24 m or more has no next step. area_class is user-supplied at the gate."
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 47(5), Table-5 (A3 rows 1-3) + Rule 47(6) + Rule 47(3)"
    remediation: "Check the plot's area class and road width against Table-5; if claimed FAR exceeds the road-band index, document the DAP density-block FAR and incentives that justify it."
    verify_flag: true
    display:
      kind: compare
      fix_on: layout_far_sheet
      headline_fail: "FAR is above the road-width limit"
      headline_pass: "FAR appears to be within the road-width limit"
      action: "Reduce FAR by {gap} to {limit}[[ (about {gap_area} of FAR-included floor area)]]."
      rows:
      - {found: claimed_far, limit: 1.25, direction: max, when: "area_class == 'dhaka_core' and road_width_m >= 1.8 and road_width_m < 2.5"}
      - {found: claimed_far, limit: 1.75, direction: max, when: "area_class == 'dhaka_core' and road_width_m >= 2.5 and road_width_m < 3.66"}
      - {found: claimed_far, limit: 2, direction: max, when: "area_class == 'dhaka_core' and road_width_m >= 3.66 and road_width_m < 4.88"}
      - {found: claimed_far, limit: "2.25 + (road_width_m - 4.88) * (3.25 - 2.25) / (6 - 4.88)", direction: max, when: "area_class == 'dhaka_core' and road_width_m >= 4.88 and road_width_m < 6"}
      - {found: claimed_far, limit: "3.25 + (road_width_m - 6) * (3.5 - 3.25) / (9 - 6)", direction: max, when: "area_class == 'dhaka_core' and road_width_m >= 6 and road_width_m < 9"}
      - {found: claimed_far, limit: "3.5 + (road_width_m - 9) * (4 - 3.5) / (12 - 9)", direction: max, when: "area_class == 'dhaka_core' and road_width_m >= 9 and road_width_m < 12"}
      - {found: claimed_far, limit: "4 + (road_width_m - 12) * (4.25 - 4) / (18 - 12)", direction: max, when: "area_class == 'dhaka_core' and road_width_m >= 12 and road_width_m < 18"}
      - {found: claimed_far, limit: "4.25 + (road_width_m - 18) * (4.75 - 4.25) / (24 - 18)", direction: max, when: "area_class == 'dhaka_core' and road_width_m >= 18 and road_width_m < 24"}
      - {found: claimed_far, limit: 4.75, direction: max, when: "area_class == 'dhaka_core' and road_width_m >= 24"}
      - {found: claimed_far, limit: 1.25, direction: max, when: "area_class == 'outer_urban' and road_width_m >= 1.8 and road_width_m < 2.5"}
      - {found: claimed_far, limit: 1.5, direction: max, when: "area_class == 'outer_urban' and road_width_m >= 2.5 and road_width_m < 3.66"}
      - {found: claimed_far, limit: 1.75, direction: max, when: "area_class == 'outer_urban' and road_width_m >= 3.66 and road_width_m < 4.88"}
      - {found: claimed_far, limit: "2 + (road_width_m - 4.88) * (2.5 - 2) / (6 - 4.88)", direction: max, when: "area_class == 'outer_urban' and road_width_m >= 4.88 and road_width_m < 6"}
      - {found: claimed_far, limit: "2.5 + (road_width_m - 6) * (3 - 2.5) / (9 - 6)", direction: max, when: "area_class == 'outer_urban' and road_width_m >= 6 and road_width_m < 9"}
      - {found: claimed_far, limit: "3 + (road_width_m - 9) * (3.5 - 3) / (12 - 9)", direction: max, when: "area_class == 'outer_urban' and road_width_m >= 9 and road_width_m < 12"}
      - {found: claimed_far, limit: "3.5 + (road_width_m - 12) * (3.75 - 3.5) / (18 - 12)", direction: max, when: "area_class == 'outer_urban' and road_width_m >= 12 and road_width_m < 18"}
      - {found: claimed_far, limit: "3.75 + (road_width_m - 18) * (4.25 - 3.75) / (24 - 18)", direction: max, when: "area_class == 'outer_urban' and road_width_m >= 18 and road_width_m < 24"}
      - {found: claimed_far, limit: 4.25, direction: max, when: "area_class == 'outer_urban' and road_width_m >= 24"}
      - {found: claimed_far, limit: 1, direction: max, when: "area_class == 'other' and road_width_m >= 1.8 and road_width_m < 2.5"}
      - {found: claimed_far, limit: 1.25, direction: max, when: "area_class == 'other' and road_width_m >= 2.5 and road_width_m < 3.66"}
      - {found: claimed_far, limit: 1.5, direction: max, when: "area_class == 'other' and road_width_m >= 3.66 and road_width_m < 4.88"}
      - {found: claimed_far, limit: "1.75 + (road_width_m - 4.88) * (2.3 - 1.75) / (6 - 4.88)", direction: max, when: "area_class == 'other' and road_width_m >= 4.88 and road_width_m < 6"}
      - {found: claimed_far, limit: "2.3 + (road_width_m - 6) * (2.8 - 2.3) / (9 - 6)", direction: max, when: "area_class == 'other' and road_width_m >= 6 and road_width_m < 9"}
      - {found: claimed_far, limit: "2.8 + (road_width_m - 9) * (3.3 - 2.8) / (12 - 9)", direction: max, when: "area_class == 'other' and road_width_m >= 9 and road_width_m < 12"}
      - {found: claimed_far, limit: "3.3 + (road_width_m - 12) * (3.5 - 3.3) / (18 - 12)", direction: max, when: "area_class == 'other' and road_width_m >= 12 and road_width_m < 18"}
      - {found: claimed_far, limit: "3.5 + (road_width_m - 18) * (4 - 3.5) / (24 - 18)", direction: max, when: "area_class == 'other' and road_width_m >= 18 and road_width_m < 24"}
      - {found: claimed_far, limit: 4, direction: max, when: "area_class == 'other' and road_width_m >= 24"}

  - id: RAJUK-PARKING-012
    title: Parking (A3) vs Bidhimala Table-8 slab (uniform flat size)
    parameters: [num_units, avg_flat_area_m2, parking_provided, road_width_m]
    logic: "road_width_m < 2.5 or ((avg_flat_area_m2 <= 60 or avg_flat_area_m2 > 90 or parking_provided >= ceil(num_units / 4)) and (avg_flat_area_m2 <= 90 or avg_flat_area_m2 > 140 or parking_provided >= ceil(num_units / 2)) and (avg_flat_area_m2 <= 140 or avg_flat_area_m2 > 200 or parking_provided >= ceil(num_units * 2 / 3)) and (avg_flat_area_m2 <= 200 or parking_provided >= ceil(num_units * 105 / 100)) and (avg_flat_area_m2 > 60 or road_width_m < 6 or parking_provided >= 1))"
    severity: Medium
    confidence_basis: "Slabs verbatim from Table-8 rows 5-9 (>200 m2: 1/flat + 5% guest; 140-200: 2 per 3; 90-140: 1 per 2; 60-90: 1 per 4; <=60 m2: motorcycle only; road 1.8-2.5 m: no parking). Table-8 Note 3 (page image, gazette p.13475): 'পার্কিং স্পেসের চাহিদার ভগ্নাংশের ক্ষেত্রে ১ (একটি) পার্কিং হিসাব করিতে হইবে' — a fractional requirement counts as one space, so each count is rounded up. Ratios are written as integer fractions (105/100, 2/3) so a whole-number requirement is never pushed up by float error. Table-8 Note 5 (page image, gazette p.13475): 'অন্য যে কোনো ধরনের ভবনের জন্য ন্যূনতম ১ (একটি) গাড়ি পার্কিং এর ব্যবস্থা থাকিতে হইবে, তবে রাস্তা প্রশস্তকরণের প্রস্তাব না থাকিলে ৬ মিটারের কম থাকিলে প্রশস্ত রাস্তা সংলগ্ন আবাসিক ভবনের জন্য জমিতে ন্যূনতম গাড়ি পার্কিং এর শর্ত বাধ্যতামূলক হইবে না' — at least one car space; a residential building on a road under 6 m with no widening proposal is exempt. Encoded as: flats of 60 m2 or less on a road of 6 m or more need at least 1 car space (every larger slab already rounds up to 1 or more). A sub-6 m road is treated as exempt because a widening proposal is not readable off the sheet. [VERIFY]: OCR'd gazette digits; encoded for a uniform flat size — mixed unit sizes need the per-band unit mix; 90/140/200 band edges overlap in the gazette text."
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 53(5), Table-8 rows 1, 5-9, Notes 3 and 5"
    remediation: "Recompute required car parking from the unit mix per Table-8 and provide at least that many stalls."
    verify_flag: true
    display:
      kind: compare
      fix_on: ground_floor
      headline_fail: "Parking is below the Table-8 requirement for this flat size"
      headline_pass: "Parking appears to meet the Table-8 requirement"
      action: "Provide at least {limit} parking spaces ({gap} more than the sheet shows)."
      rows:
        - {found: parking_provided, limit: "ceil(num_units / 4)", direction: min, when: "road_width_m >= 2.5 and avg_flat_area_m2 > 60 and avg_flat_area_m2 <= 90"}
        - {found: parking_provided, limit: "ceil(num_units / 2)", direction: min, when: "road_width_m >= 2.5 and avg_flat_area_m2 > 90 and avg_flat_area_m2 <= 140"}
        - {found: parking_provided, limit: "ceil(num_units * 2 / 3)", direction: min, when: "road_width_m >= 2.5 and avg_flat_area_m2 > 140 and avg_flat_area_m2 <= 200"}
        - {found: parking_provided, limit: "ceil(num_units * 105 / 100)", direction: min, when: "road_width_m >= 2.5 and avg_flat_area_m2 > 200"}
        - {found: parking_provided, limit: 1, direction: min, when: "road_width_m >= 6 and avg_flat_area_m2 <= 60"}

  - id: RAJUK-LIFT-013
    title: "Lift count (Bidhimala) — >18 m needs a lift; >33 m/10 storeys needs 2 + stretcher lift"
    parameters: [building_height_m, num_storeys, num_lifts]
    logic: "(building_height_m <= 18 or num_lifts >= 1) and ((building_height_m <= 33 and num_storeys <= 10) or (num_lifts >= 2 and param_present('has_stretcher_lift')))"
    severity: High
    confidence_basis: "Thresholds verbatim from Rule 59(1) (>18 m -> lift) and 59(2) (>33 m or >10 storeys -> min 2 lifts, at least 1 stretcher lift). [VERIFY] OCR'd gazette digits + stretcher-lift presence-read reliability."
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 59(1)-(2)"
    remediation: "Provide the lift count for the height band; designate at least one stretcher lift for buildings over 33 m / 10 storeys."
    verify_flag: true
    display:
      kind: compare
      fix_on: typical_floor
      headline_fail: "Not enough lifts for the building height"
      headline_pass: "Lift count appears to meet the height requirement"
      action: "The height needs {limit} or more lifts; the sheet shows {found}."
      rows:
        - {found: num_lifts, limit: 1, direction: min, when: "building_height_m > 18"}
        - {found: num_lifts, limit: 2, direction: min, when: "building_height_m > 33 or num_storeys > 10"}
        - {require: has_stretcher_lift, label: "Stretcher lift", headline: "A stretcher lift is not shown", when: "building_height_m > 33 or num_storeys > 10", action: "Designate one lift as a stretcher lift."}

  - id: RAJUK-STAIRWIDTH-014
    title: "Stair flight width for A3 (Bidhimala Table-10, 1.15 m)"
    parameters: [exit_stair_width_m]
    logic: "exit_stair_width_m >= 1.15"
    severity: High
    confidence_basis: "Verbatim Rule 57(d)(1): 'বিভিন্ন ধরনের সিঁড়ির প্রতিটি ফ্লাইটের বাঁধামুক্ত ন্যূনতম প্রশস্ততার পরিমাপ নিম্নবর্ণিত সারণি ১০ অনুযায়ী হইবে' (minimum unobstructed width of each stair flight per Table-10). Table-10 row 1, 'A3 ফ্ল্যাট ও এ্যাপার্টমেন্ট বাড়ি' = ১.১৫ m (page image read at 400 dpi, PDF p.73 / gazette p.13481). Applies to every flight; the value checked is the extracted exit-stair width. [VERIFY]: unsigned. BNBC-STAIRWIDTH-008 sets 1.12 m for the same stair under BNBC Table 4.3.6; expert brief Q9c decides whether both rules stand."
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 57(d)(1), Table-10"
    remediation: "Widen each stair flight to at least 1.15 m clear."
    verify_flag: true
    display:
      kind: compare
      fix_on: typical_floor
      headline_fail: "Stair is narrower than the Bidhimala minimum"
      headline_pass: "Stair width appears to meet the Bidhimala minimum"
      action: "Widen each stair flight by {gap} to at least {limit}."
      rows:
        - {found: exit_stair_width_m, limit: 1.15, direction: min}

  - id: RAJUK-EGRESS-015
    title: "Two fire-safe stairs above 10 storeys or 33 m (Bidhimala Appendix-1)"
    parameters: [num_storeys, building_height_m, num_exit_stairs]
    logic: "(num_exit_stairs >= 2 and param_present('has_fire_rated_stair_enclosure')) if (num_storeys > 10 or building_height_m > 33) else True"
    severity: Critical
    confidence_basis: "Verbatim Appendix-1 para 12.4 (page image, PDF p.101 / gazette p.13509): '১০ তলা বা ৩৩ মিটার অপেক্ষা অধিক উচ্চতাবিশিষ্ট সকল ইমারতের জন্য ... কমপক্ষে ২টি সিঁড়ি থাকিতে হইবে এবং এই ক্ষেত্রে সিঁড়ি ঘর অগ্নিনিরাপদ হইতে হইবে' (more than 10 storeys or 33 m: at least 2 stairs, and the stairwell fire-safe). Table-5 lets A3 keep one stair up to 10 floors (at most 4 units per floor, 23 m travel), and 12.3 sets exits by users per floor below that; neither is encoded here. The fire-safe stair is read as has_fire_rated_stair_enclosure. [VERIFY]: unsigned; BNBC-EGRESS-001 keeps its 20 m screening trigger beside this sourced 33 m one (G-1)."
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Appendix-1 (fire safety) para 12.4"
    remediation: "Provide at least two exit stairs in fire-safe enclosures opening to open air or a designated safe place."
    verify_flag: true
    display:
      kind: compare
      fix_on: typical_floor
      headline_fail: "A building over 10 storeys or 33 m needs two fire-safe stairs"
      headline_pass: "Stair count appears to meet the Bidhimala high-rise rule"
      action: "Show at least {limit} exit stairs; the sheet shows {found}."
      rows:
        - {found: num_exit_stairs, limit: 2, direction: min, when: "num_storeys > 10 or building_height_m > 33"}
        - {require: has_fire_rated_stair_enclosure, label: "Fire-safe stair enclosure", headline: "The stairs are not shown as fire-safe", when: "num_storeys > 10 or building_height_m > 33", action: "Show the stair enclosures as fire-safe (fire-rated, smoke-protected)."}

