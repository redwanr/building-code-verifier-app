        - {found: toilet_width_m, limit: 1, direction: min, action: "Widen the toilet by {gap} to at least {limit}."}

  - id: RAJUK-STAIRGEOM-021
    title: "Stair riser at most 175 mm, tread at least 225 mm, sum at least 400 mm (Bidhimala Rule 57(d)(2))"
