# ---------------------------------------------------------------------------
# LOOKUPS — the same gazette tables the *B / numbered rules above encode, in
# tabular form so they can be read FORWARD (given a plot, what is permitted?)
# rather than only backward (is this claim within what is permitted?).
#
# WHY THIS EXISTS. Two reasons, both real:
#   1. The feasibility calculator (`web/src/engine/feasibility.ts`) answers the
#      pre-design question Dhaka firms spend client meetings on — "what can I
#      build on this plot?" That is the same data, read the other way.
#   2. Those bands currently live ONLY inside ~1500-character simpleeval
#      implication chains. A domain expert cannot audit an implication chain.
#      This is the form the expert sign-off sitting actually needs.
#
# NO NEW VALUES. Every number below already appears in a rule's `logic` above,
# with the same citation and the same verify_flag. Nothing here was sourced
# independently, inferred, or converted. `web/src/engine/pack-lint.test.ts`
# evaluates each rule at every band edge and fails if the two forms disagree.
#
# The engines ignore this key — `parsePack()` (rules.ts / rules.py) reads only
# `rules:`. Adding it cannot change any verdict.
lookups:

  # Table-5, sub-class A3 (flats & apartments) ONLY.
  #
  # A1/A2/A4/A5/A6 are DELIBERATELY ABSENT. Their cells exist in
  # research/08-sro-468-2025.md but are NOT verified — the "108/108 match"
  # claim was retracted on 2026-07-25 after being checked against a defective
  # column mapping, and area-group 2 has never been re-read. The A3 rows are
  # the exception: they are corroborated by two independent instruments (this
  # Bidhimala Table-5 OCR and the 400/500-dpi S.R.O. 468-Ain/2025 gazette page
  # renders of DAP Appendix 3.5), which agree on all 27 cells. A consumer given
  # an unlisted sub-class must emit "cannot evaluate" (FR-9), never a guess.
  #
  # NOTE — Table-5 and DAP Appendix 3.5 are the SAME TABLE. The gazette prints
  # the road axis as three ranges followed by six SINGLE VALUES (4.88 / 6.0 /
  # 9.0 / 12.0 / 18.0 / 24.0-or-above m), not the ranges encoded here. The
  # bands below hold each step from its own value up to the next. Rule 47(6)
  # (encoded 2026-10-28) raises FAR linearly between single-value steps: from
  # `interpolate_from_m` up, a road between two steps gets
  # f0 + (w - w0) * (f1 - f0) / (w1 - w0). The three range columns below
  # 4.88 m stay flat, and 24 m or more has no next step. RAJUK-FAR-ROADBAND-011's
  # logic and display rows are GENERATED from these bands by
  # tools/gen_roadband_logic.py — edit the bands, then rerun it. Rule 47(3)
  # allows DAP incentives to exceed the road-band FAR up to the maximum FAR
  # (Q8b); a forward consumer MUST surface that caveat.
  far_by_road_width:
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 47(5), Table-5 (A3 rows 1-3) + Rule 47(3); same table as DAP Appendix 3.5 as replaced by S.R.O. 468-Ain/2025"
    rule_id: RAJUK-FAR-ROADBAND-011
    verify_flag: true
    sub_class: A3
    # Rule 47(6): linear between steps from this road width up.
    interpolate_from_m: 4.88
    # road_min_m inclusive, road_max_m exclusive; null max = no upper bound.
    # area_class keys match the `area_class` param the rule reads at the gate.
    bands:
      - {road_min_m: 1.80, road_max_m: 2.50,  dhaka_core: 1.25, outer_urban: 1.25, other: 1.00}
      - {road_min_m: 2.50, road_max_m: 3.66,  dhaka_core: 1.75, outer_urban: 1.50, other: 1.25}
      - {road_min_m: 3.66, road_max_m: 4.88,  dhaka_core: 2.00, outer_urban: 1.75, other: 1.50}
      - {road_min_m: 4.88, road_max_m: 6.00,  dhaka_core: 2.25, outer_urban: 2.00, other: 1.75}
      - {road_min_m: 6.00, road_max_m: 9.00,  dhaka_core: 3.25, outer_urban: 2.50, other: 2.30}
      - {road_min_m: 9.00, road_max_m: 12.00, dhaka_core: 3.50, outer_urban: 3.00, other: 2.80}
      - {road_min_m: 12.00, road_max_m: 18.00, dhaka_core: 4.00, outer_urban: 3.50, other: 3.30}
      - {road_min_m: 18.00, road_max_m: 24.00, dhaka_core: 4.25, outer_urban: 3.75, other: 3.50}
      - {road_min_m: 24.00, road_max_m: null,  dhaka_core: 4.75, outer_urban: 4.25, other: 4.00}

  # Table-3, maximum ground coverage by plot size.
  #
  # KATHA WARNING — the bracket edges are metric renderings of katha counts at
  # ~67 m²/katha (2/3/4/6/10/14/20/40 katha -> 134/201/268/402/670/937/1339/
  # 2677 m²). A true katha is 66.8902 m², so an exact 3-katha plot measures
  # 200.67 m² and falls just BELOW the 201 edge — landing in the 67.5% bracket
  # rather than the 65% one. A real RAJUK-approved submission on exactly such a
  # plot (Uttara 15/C-1, 200.67 m²) states its allowable coverage as 65%, i.e.
  # the firm reads the boundary the other way. This pack is therefore MORE
  # PERMISSIVE than observed practice for every exact-katha plot — a false
  # negative, and 3 katha is among the most common plot sizes in Dhaka.
  # Unresolved: expert question Q8c. Do not "fix" the edges without sign-off.
  mgc_by_plot_area:
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 45(1), Table-3"
    rule_id: RAJUK-MGC-004B
    verify_flag: true
    # plot_max_m2 inclusive; null = no upper bound. Columns 4, 6 and 7 of
    # Table-3 (page image, PDF p.48 / gazette p.13456; every row satisfies
    # col 5 = 100 - col 4 and col 7 = col 5 - col 6, as the header "৭ (৫—৬)"
    # states, which rules out a ৪/৮ misread). additional_pct = col 6, the
    # paved/covered extra allowed beyond MGC (RAJUK-PAVED-026, capped by Note 1
    # at 75% minus col 4). permeable_pct = col 7, the area kept permeable for
    # rainwater (RAJUK-PERMEABLE-025). A6 affordable housing (75 / 12.5 / 12.5)
    # and road-surrender exclusions are NOT encoded.
    brackets:
      - {plot_max_m2: 134,   max_mgc_pct: 70.0 , additional_pct: 15.0  , permeable_pct: 15.0}
      - {plot_max_m2: 201,   max_mgc_pct: 67.5 , additional_pct: 16.25 , permeable_pct: 16.25}
      - {plot_max_m2: 268,   max_mgc_pct: 65.0 , additional_pct: 17.5  , permeable_pct: 17.5}
      - {plot_max_m2: 402,   max_mgc_pct: 62.5 , additional_pct: 18.75 , permeable_pct: 18.75}
      - {plot_max_m2: 670,   max_mgc_pct: 60.0 , additional_pct: 20.0  , permeable_pct: 20.0}
      - {plot_max_m2: 937,   max_mgc_pct: 55.0 , additional_pct: 22.5  , permeable_pct: 22.5}
      - {plot_max_m2: 1339,  max_mgc_pct: 50.0 , additional_pct: 25.0  , permeable_pct: 25.0}
      - {plot_max_m2: 2677,  max_mgc_pct: 45.0 , additional_pct: 27.5  , permeable_pct: 27.5}
      - {plot_max_m2: null,  max_mgc_pct: 40.0 , additional_pct: 30.0  , permeable_pct: 30.0}

  # Table-1, minimum setbacks by storey count.
  #
  # front_min_m is Rule 41(1)'s from-the-boundary branch. The alternative
  # "4.5 m from the road centre-line" branch is NOT encoded here for the same
  # reason the rule omits it — it is not sheet-readable. A forward consumer
  # must state that the binding front setback is the GREATER of 1.5 m from the
  # boundary and 4.5 m from the road centre-line.
  setbacks_by_storeys:
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 41(1),(3), Table-1"
    rule_id: RAJUK-SETBACK-005B
    verify_flag: true
    # storeys_max inclusive; null = no upper bound.
    bands:
      - {storeys_max: 7,    front_min_m: 1.5, side_min_m: 1.00, rear_min_m: 1.25}
      - {storeys_max: 10,   front_min_m: 1.5, side_min_m: 1.25, rear_min_m: 2.00}
      - {storeys_max: 15,   front_min_m: 1.5, side_min_m: 3.00, rear_min_m: 3.00}
      - {storeys_max: 20,   front_min_m: 1.5, side_min_m: 3.25, rear_min_m: 3.25}
      - {storeys_max: 30,   front_min_m: 1.5, side_min_m: 3.50, rear_min_m: 3.50}
      - {storeys_max: 40,   front_min_m: 1.5, side_min_m: 4.50, rear_min_m: 4.50}
      - {storeys_max: null, front_min_m: 1.5, side_min_m: 5.00, rear_min_m: 5.00}

  # Table-8, car parking for A3 at a uniform flat size.
  #
  # Each slab is an exact ratio: `cars` spaces per `per_units` units. The
  # required count is ceil(num_units * cars / per_units) — Table-8 Note 3
  # counts a fraction as one space. Integer fractions keep a whole-number
  # requirement exact (0.666667 x 9 would round 6 up to 7). Mixed unit
  # sizes need the per-band unit mix, which this flat encoding does not carry
  # (same limitation the rule declares) — a forward consumer given a MIX must
  # emit "cannot evaluate". The gazette's 90/140/200 band edges overlap in the
  # source text; edges here follow the rule's reading.
  parking_by_flat_area:
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 53(5), Table-8 rows 1, 5-9, Notes 3 and 5"
    rule_id: RAJUK-PARKING-012
    verify_flag: true
    # No car parking is required at all when the front road is under 2.5 m
    # (Table-8 row 1) — this gate is checked before the slabs.
    no_parking_below_road_width_m: 2.50
    # Note 5: at least one car space from this road width up (a narrower road
    # is exempt for residential buildings when no widening is proposed).
    min_one_car_from_road_width_m: 6.00
    # flat_area_max_m2 inclusive; null = no upper bound.
    slabs:
      - {flat_area_max_m2: 60,   cars: 0,   per_units: 1,   note: "motorcycle parking only"}
      - {flat_area_max_m2: 90,   cars: 1,   per_units: 4,   note: "1 per 4 units"}
      - {flat_area_max_m2: 140,  cars: 1,   per_units: 2,   note: "1 per 2 units"}
      - {flat_area_max_m2: 200,  cars: 2,   per_units: 3,   note: "2 per 3 units"}
      - {flat_area_max_m2: null, cars: 105, per_units: 100, note: "1 per flat + 5% guest"}
