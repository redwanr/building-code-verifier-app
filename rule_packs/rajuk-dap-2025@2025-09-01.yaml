# RAJUK DAP/Bidhimala planning rule pack (FAR, MGC, setbacks, parking, lifts).
# Primary source: Imarat Nirman Bidhimala 2025 (Bangladesh Gazette 2025-12-14)
# + RAJUK DAP 2022-2035. All quotes + derivations:
# docs/new_features/nirman-traceability.md (source text:
# docs/new_features/bidhimala-dap-text.md, Gemini-OCR'd Bengali — hence every
# numeric rule below keeps verify_flag: true until the domain expert confirms
# the digits against the gazette scan).
# User-supplied values (permissible_far, allowable_mgc_pct, required setbacks,
# parking_required) stay ward/plan-specific at the confirmation gate; the *B /
# numbered sourced rules cross-check against the gazette tables directly.
jurisdiction: rajuk-dap-2025
effective_date: "2025-09-01"
source: RAJUK-DAP/Bidhimala

rules:
  - id: RAJUK-FAR-003-LIMIT
    title: Claimed FAR within permissible FAR
    parameters: [claimed_far, permissible_far]
    logic: "claimed_far <= permissible_far"
    severity: High
    confidence_basis: "Principle sourced (Bidhimala 2025 Rule 47(3): base FAR = smaller of area-based and road-based FAR, binding); permissible value is plot-specific (DAP density block + incentives) and user-supplied [VERIFY]"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 47 + DAP 2022-2035 density-block FAR"
    remediation: "Verify claimed FAR against the plot's DAP density-block FAR and road-based FAR (Rule 47, Table-5)."
    verify_flag: true

  - id: RAJUK-FAR-003-CONSISTENCY
    title: Claimed FAR consistent with floor-area / plot-area math
    parameters: [claimed_far, total_floor_area_m2, plot_area_m2]
    logic: "consistency([claimed_far, total_floor_area_m2 / plot_area_m2])"
    severity: High
    confidence_basis: "Internal arithmetic consistency per the gazette's own formula (Bidhimala 2025 definition (81)); no external threshold. FAR-exempt areas (Rule 49) may explain small gaps — tolerance 5%."
    citation: "Imarat Nirman Bidhimala 2025 definition (81) — FAR = total floor area / plot area (exempt areas per Rule 49 excluded)"
    remediation: "Reconcile the FAR figure with total floor area / plot area on the sheet (check Rule 49 exemptions)."
    verify_flag: false

  - id: RAJUK-MGC-004
    title: Ground coverage (MGC) within allowable (user-supplied)
    parameters: [claimed_mgc_pct, allowable_mgc_pct]
    logic: "claimed_mgc_pct <= allowable_mgc_pct"
    severity: High
    confidence_basis: "Principle sourced (Bidhimala 2025 Rule 45(1), Table-3); allowable % user-supplied at the gate [VERIFY] — see RAJUK-MGC-004B for the direct table check"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 45(1), Table-3 (Maximum Ground Coverage by plot size)"
    remediation: "Reduce footprint or confirm plot bracket; reconcile MGC with allowable."
    verify_flag: true

  - id: RAJUK-MGC-004B
    title: Ground coverage (MGC) vs Bidhimala Table-3 plot-size bracket
    parameters: [claimed_mgc_pct, plot_area_m2]
    logic: "(plot_area_m2 > 134 or claimed_mgc_pct <= 70) and (plot_area_m2 <= 134 or plot_area_m2 > 201 or claimed_mgc_pct <= 67.5) and (plot_area_m2 <= 201 or plot_area_m2 > 268 or claimed_mgc_pct <= 65) and (plot_area_m2 <= 268 or plot_area_m2 > 402 or claimed_mgc_pct <= 62.5) and (plot_area_m2 <= 402 or plot_area_m2 > 670 or claimed_mgc_pct <= 60) and (plot_area_m2 <= 670 or plot_area_m2 > 937 or claimed_mgc_pct <= 55) and (plot_area_m2 <= 937 or plot_area_m2 > 1339 or claimed_mgc_pct <= 50) and (plot_area_m2 <= 1339 or plot_area_m2 > 2677 or claimed_mgc_pct <= 45) and (plot_area_m2 <= 2677 or claimed_mgc_pct <= 40)"
    severity: High
    confidence_basis: "Brackets verbatim from Table-3 (max MGC 70/67.5/65/62.5/60/55/50/45/40% by plot size); [VERIFY] OCR'd gazette digits + Table-3 exceptions (extra paved coverage col-6, A6 affordable housing 75%, road-surrender exclusions) not encoded"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 45(1), Table-3"
    remediation: "Reduce ground coverage to the Table-3 maximum for the plot-size bracket, or document an applicable Table-3/Table-4 exception."
    verify_flag: true

  - id: RAJUK-SETBACK-005
    title: Setbacks (front/rear/side) vs required schedule (user-supplied)
    parameters: [front_setback_m, rear_setback_m, side_setback_m,
                 required_front_setback_m, required_rear_setback_m, required_side_setback_m]
    logic: "front_setback_m >= required_front_setback_m and rear_setback_m >= required_rear_setback_m and side_setback_m >= required_side_setback_m"
    severity: High
    confidence_basis: "Principle sourced (Bidhimala 2025 Rule 41, Table-1); required values user-supplied for plan/ward specifics [VERIFY] — see RAJUK-SETBACK-005B for the direct table check"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 41 + Table-1 (minimum setbacks by storey count)"
    remediation: "Confirm setbacks meet Rule 41/Table-1 for this storey count and plot situation."
    verify_flag: true

  - id: RAJUK-SETBACK-005B
    title: Setbacks vs Bidhimala Table-1 storey bands
    parameters: [num_storeys, front_setback_m, side_setback_m, rear_setback_m]
    logic: "front_setback_m >= 1.5 and (num_storeys > 7 or (side_setback_m >= 1.0 and rear_setback_m >= 1.25)) and (num_storeys <= 7 or num_storeys > 10 or (side_setback_m >= 1.25 and rear_setback_m >= 2.0)) and (num_storeys <= 10 or num_storeys > 15 or (side_setback_m >= 3.0 and rear_setback_m >= 3.0)) and (num_storeys <= 15 or num_storeys > 20 or (side_setback_m >= 3.25 and rear_setback_m >= 3.25)) and (num_storeys <= 20 or num_storeys > 30 or (side_setback_m >= 3.5 and rear_setback_m >= 3.5)) and (num_storeys <= 30 or num_storeys > 40 or (side_setback_m >= 4.5 and rear_setback_m >= 4.5)) and (num_storeys <= 40 or (side_setback_m >= 5.0 and rear_setback_m >= 5.0))"
    severity: High
    confidence_basis: "Side/rear bands verbatim from Table-1; front >= 1.5 m from boundary per Rule 41(1) (the alternative 4.5 m-from-road-centre branch is not sheet-readable). [VERIFY] OCR'd gazette digits + Rule 41(1) road-centre condition + Table-2 exceptions not encoded"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 41(1),(3), Table-1"
    remediation: "Increase side/rear setbacks to the Table-1 minimum for the storey band; keep front setback >= 1.5 m from the boundary (and >= 4.5 m from the road centre-line)."
    verify_flag: true

  - id: RAJUK-PARKING-006-RATIO
    title: Parking provided meets required count (user-supplied)
    parameters: [parking_provided, parking_required]
    logic: "parking_provided >= parking_required"
    severity: Medium
    confidence_basis: "Principle sourced (Bidhimala 2025 Rule 53(5), Table-8); required count user-supplied for the actual unit mix [VERIFY] — see RAJUK-PARKING-012 for the direct slab check"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 53(5), Table-8 (minimum parking by occupancy)"
    remediation: "Reconcile required vs provided parking for the unit mix."
    verify_flag: true

  - id: RAJUK-PARKING-006-CONSISTENCY
    title: Parking table consistent with count shown on plan
    parameters: [parking_provided_table, parking_count_on_plan]
    logic: "consistency([parking_provided_table, parking_count_on_plan], 0.0)"
    severity: Medium
    confidence_basis: "Internal consistency — rule-independent, no external threshold"
    citation: "RAJUK submission data table vs plan — parking count reconciliation"
    remediation: "Fix the mismatch between the parking table and the count shown on plan."
    verify_flag: false

  - id: RAJUK-FAR-ROADBAND-011
    title: Claimed FAR vs road-width FAR index (A3 flats, Table-5)
    parameters: [claimed_far, road_width_m, area_class]
    logic: "(area_class != 'dhaka_core' or ((road_width_m < 1.8 or road_width_m >= 2.5 or claimed_far <= 1.25) and (road_width_m < 2.5 or road_width_m >= 3.66 or claimed_far <= 1.75) and (road_width_m < 3.66 or road_width_m >= 4.88 or claimed_far <= 2.0) and (road_width_m < 4.88 or road_width_m >= 6 or claimed_far <= 2.25) and (road_width_m < 6 or road_width_m >= 9 or claimed_far <= 3.25) and (road_width_m < 9 or road_width_m >= 12 or claimed_far <= 3.5) and (road_width_m < 12 or road_width_m >= 18 or claimed_far <= 4.0) and (road_width_m < 18 or road_width_m >= 24 or claimed_far <= 4.25) and (road_width_m < 24 or claimed_far <= 4.75))) and (area_class != 'outer_urban' or ((road_width_m < 1.8 or road_width_m >= 2.5 or claimed_far <= 1.25) and (road_width_m < 2.5 or road_width_m >= 3.66 or claimed_far <= 1.5) and (road_width_m < 3.66 or road_width_m >= 4.88 or claimed_far <= 1.75) and (road_width_m < 4.88 or road_width_m >= 6 or claimed_far <= 2.0) and (road_width_m < 6 or road_width_m >= 9 or claimed_far <= 2.5) and (road_width_m < 9 or road_width_m >= 12 or claimed_far <= 3.0) and (road_width_m < 12 or road_width_m >= 18 or claimed_far <= 3.5) and (road_width_m < 18 or road_width_m >= 24 or claimed_far <= 3.75) and (road_width_m < 24 or claimed_far <= 4.25))) and (area_class != 'other' or ((road_width_m < 1.8 or road_width_m >= 2.5 or claimed_far <= 1.0) and (road_width_m < 2.5 or road_width_m >= 3.66 or claimed_far <= 1.25) and (road_width_m < 3.66 or road_width_m >= 4.88 or claimed_far <= 1.5) and (road_width_m < 4.88 or road_width_m >= 6 or claimed_far <= 1.75) and (road_width_m < 6 or road_width_m >= 9 or claimed_far <= 2.3) and (road_width_m < 9 or road_width_m >= 12 or claimed_far <= 2.8) and (road_width_m < 12 or road_width_m >= 18 or claimed_far <= 3.3) and (road_width_m < 18 or road_width_m >= 24 or claimed_far <= 3.5) and (road_width_m < 24 or claimed_far <= 4.0)))"
    severity: High
    confidence_basis: "A3 row of Table-5 verbatim for all three area classes (dhaka_core / outer_urban / other). [VERIFY]: OCR'd gazette digits; Rule 47(3) allows exceeding road-FAR with DAP incentives up to max FAR; Rule 47(6) pro-rata interpolation between road steps not encoded (band value used, conservative). area_class is user-supplied at the gate."
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 47(5), Table-5 (A3 rows 1-3) + Rule 47(3)"
    remediation: "Check the plot's area class and road width against Table-5; if claimed FAR exceeds the road-band index, document the DAP density-block FAR and incentives that justify it."
    verify_flag: true

  - id: RAJUK-PARKING-012
    title: Parking (A3) vs Bidhimala Table-8 slab (uniform flat size)
    parameters: [num_units, avg_flat_area_m2, parking_provided, road_width_m]
    logic: "road_width_m < 2.5 or ((avg_flat_area_m2 <= 60 or avg_flat_area_m2 > 90 or parking_provided >= num_units / 4) and (avg_flat_area_m2 <= 90 or avg_flat_area_m2 > 140 or parking_provided >= num_units / 2) and (avg_flat_area_m2 <= 140 or avg_flat_area_m2 > 200 or parking_provided >= num_units * 2 / 3) and (avg_flat_area_m2 <= 200 or parking_provided >= num_units * 1.05))"
    severity: Medium
    confidence_basis: "Slabs verbatim from Table-8 rows 5-9 (>200 m2: 1/flat + 5% guest; 140-200: 2 per 3; 90-140: 1 per 2; 60-90: 1 per 4; <=60 m2: motorcycle only; road 1.8-2.5 m: no parking). [VERIFY]: OCR'd gazette digits; encoded for a uniform flat size — mixed unit sizes need the per-band unit mix; 90/140/200 band edges overlap in the gazette text."
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 53(5), Table-8 rows 1, 5-9"
    remediation: "Recompute required car parking from the unit mix per Table-8 and provide at least that many stalls."
    verify_flag: true

  - id: RAJUK-LIFT-013
    title: "Lift count (Bidhimala) — >18 m needs a lift; >33 m/10 storeys needs 2 + stretcher lift"
    parameters: [building_height_m, num_storeys, num_lifts]
    logic: "(building_height_m <= 18 or num_lifts >= 1) and ((building_height_m <= 33 and num_storeys <= 10) or (num_lifts >= 2 and param_present('has_stretcher_lift')))"
    severity: High
    confidence_basis: "Thresholds verbatim from Rule 59(1) (>18 m -> lift) and 59(2) (>33 m or >10 storeys -> min 2 lifts, at least 1 stretcher lift). [VERIFY] OCR'd gazette digits + stretcher-lift presence-read reliability."
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 59(1)-(2)"
    remediation: "Provide the lift count for the height band; designate at least one stretcher lift for buildings over 33 m / 10 storeys."
    verify_flag: true

  - id: RAJUK-CROSSSHEET-013-PARKING
    scope: cross_sheet
    title: "Parking count consistency across all submission sheets"
    parameters: ["parking_provided"]
    logic: "consistency(reads('parking_provided'))"
    severity: "Medium"
    confidence_basis: "cross-sheet reconciliation (FR-22) — flags when the parking count differs across the site plan, floor plans, and parking layout sheets of the same submission"
    citation: "N/A — internal consistency check across submission sheets, not a coded RAJUK/BNBC threshold"
    remediation: "Reconcile the stated parking count so every sheet in the submission (site plan, floor plans, parking layout) shows the same figure before resubmission."
    verify_flag: false

# ---------------------------------------------------------------------------
# LOOKUPS — the same gazette tables the *B / numbered rules above encode, in
# tabular form so they can be read FORWARD (given a plot, what is permitted?)
# rather than only backward (is this claim within what is permitted?).
#
# WHY THIS EXISTS. Two reasons, both real:
#   1. The feasibility calculator (`web/src/engine/feasibility.ts`) answers the
#      pre-design question Dhaka firms spend client meetings on — "what can I
#      build on this plot?" That is the same data, read the other way.
#   2. Those bands currently live ONLY inside ~1500-character simpleeval
#      implication chains. A domain expert cannot audit an implication chain.
#      This is the form the expert sign-off sitting actually needs.
#
# NO NEW VALUES. Every number below already appears in a rule's `logic` above,
# with the same citation and the same verify_flag. Nothing here was sourced
# independently, inferred, or converted. `web/src/engine/pack-lint.test.ts`
# evaluates each rule at every band edge and fails if the two forms disagree.
#
# The engines ignore this key — `parsePack()` (rules.ts / rules.py) reads only
# `rules:`. Adding it cannot change any verdict.
lookups:

  # Table-5, sub-class A3 (flats & apartments) ONLY.
  #
  # A1/A2/A4/A5/A6 are DELIBERATELY ABSENT. Their cells exist in
  # research/08-sro-468-2025.md but are NOT verified — the "108/108 match"
  # claim was retracted on 2026-07-25 after being checked against a defective
  # column mapping, and area-group 2 has never been re-read. The A3 rows are
  # the exception: they are corroborated by two independent instruments (this
  # Bidhimala Table-5 OCR and the 400/500-dpi S.R.O. 468-Ain/2025 gazette page
  # renders of DAP Appendix 3.5), which agree on all 27 cells. A consumer given
  # an unlisted sub-class must emit "cannot evaluate" (FR-9), never a guess.
  #
  # NOTE — Table-5 and DAP Appendix 3.5 are the SAME TABLE. The gazette prints
  # the road axis as three ranges followed by six SINGLE VALUES (4.88 / 6.0 /
  # 9.0 / 12.0 / 18.0 / 24.0-or-above m), not the ranges encoded here. The
  # ranges are this pack's deliberate conservative reading: a plot on a 7.5 m
  # road gets the 6.0 m value. Rule 47(6) provides pro-rata interpolation
  # between road steps and is NOT encoded (expert question Q8a). Rule 47(3)
  # allows DAP incentives to exceed the road-band FAR up to the maximum FAR
  # (Q8b). A forward consumer MUST surface both caveats — understating
  # permissible FAR is safe when checking a submitted claim, but it is a wrong
  # answer when advising a client before they buy.
  far_by_road_width:
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 47(5), Table-5 (A3 rows 1-3) + Rule 47(3); same table as DAP Appendix 3.5 as replaced by S.R.O. 468-Ain/2025"
    rule_id: RAJUK-FAR-ROADBAND-011
    verify_flag: true
    sub_class: A3
    # road_min_m inclusive, road_max_m exclusive; null max = no upper bound.
    # area_class keys match the `area_class` param the rule reads at the gate.
    bands:
      - {road_min_m: 1.80, road_max_m: 2.50,  dhaka_core: 1.25, outer_urban: 1.25, other: 1.00}
      - {road_min_m: 2.50, road_max_m: 3.66,  dhaka_core: 1.75, outer_urban: 1.50, other: 1.25}
      - {road_min_m: 3.66, road_max_m: 4.88,  dhaka_core: 2.00, outer_urban: 1.75, other: 1.50}
      - {road_min_m: 4.88, road_max_m: 6.00,  dhaka_core: 2.25, outer_urban: 2.00, other: 1.75}
      - {road_min_m: 6.00, road_max_m: 9.00,  dhaka_core: 3.25, outer_urban: 2.50, other: 2.30}
      - {road_min_m: 9.00, road_max_m: 12.00, dhaka_core: 3.50, outer_urban: 3.00, other: 2.80}
      - {road_min_m: 12.00, road_max_m: 18.00, dhaka_core: 4.00, outer_urban: 3.50, other: 3.30}
      - {road_min_m: 18.00, road_max_m: 24.00, dhaka_core: 4.25, outer_urban: 3.75, other: 3.50}
      - {road_min_m: 24.00, road_max_m: null,  dhaka_core: 4.75, outer_urban: 4.25, other: 4.00}

  # Table-3, maximum ground coverage by plot size.
  #
  # KATHA WARNING — the bracket edges are metric renderings of katha counts at
  # ~67 m²/katha (2/3/4/6/10/14/20/40 katha -> 134/201/268/402/670/937/1339/
  # 2677 m²). A true katha is 66.8902 m², so an exact 3-katha plot measures
  # 200.67 m² and falls just BELOW the 201 edge — landing in the 67.5% bracket
  # rather than the 65% one. A real RAJUK-approved submission on exactly such a
  # plot (Uttara 15/C-1, 200.67 m²) states its allowable coverage as 65%, i.e.
  # the firm reads the boundary the other way. This pack is therefore MORE
  # PERMISSIVE than observed practice for every exact-katha plot — a false
  # negative, and 3 katha is among the most common plot sizes in Dhaka.
  # Unresolved: expert question Q8c. Do not "fix" the edges without sign-off.
  mgc_by_plot_area:
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 45(1), Table-3"
    rule_id: RAJUK-MGC-004B
    verify_flag: true
    # plot_max_m2 inclusive; null = no upper bound. Exceptions in the rule's
    # confidence_basis (extra paved coverage col-6, A6 affordable housing 75%,
    # road-surrender exclusions) are NOT encoded.
    brackets:
      - {plot_max_m2: 134,  max_mgc_pct: 70.0}
      - {plot_max_m2: 201,  max_mgc_pct: 67.5}
      - {plot_max_m2: 268,  max_mgc_pct: 65.0}
      - {plot_max_m2: 402,  max_mgc_pct: 62.5}
      - {plot_max_m2: 670,  max_mgc_pct: 60.0}
      - {plot_max_m2: 937,  max_mgc_pct: 55.0}
      - {plot_max_m2: 1339, max_mgc_pct: 50.0}
      - {plot_max_m2: 2677, max_mgc_pct: 45.0}
      - {plot_max_m2: null, max_mgc_pct: 40.0}

  # Table-1, minimum setbacks by storey count.
  #
  # front_min_m is Rule 41(1)'s from-the-boundary branch. The alternative
  # "4.5 m from the road centre-line" branch is NOT encoded here for the same
  # reason the rule omits it — it is not sheet-readable. A forward consumer
  # must state that the binding front setback is the GREATER of 1.5 m from the
  # boundary and 4.5 m from the road centre-line.
  setbacks_by_storeys:
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 41(1),(3), Table-1"
    rule_id: RAJUK-SETBACK-005B
    verify_flag: true
    # storeys_max inclusive; null = no upper bound.
    bands:
      - {storeys_max: 7,    front_min_m: 1.5, side_min_m: 1.00, rear_min_m: 1.25}
      - {storeys_max: 10,   front_min_m: 1.5, side_min_m: 1.25, rear_min_m: 2.00}
      - {storeys_max: 15,   front_min_m: 1.5, side_min_m: 3.00, rear_min_m: 3.00}
      - {storeys_max: 20,   front_min_m: 1.5, side_min_m: 3.25, rear_min_m: 3.25}
      - {storeys_max: 30,   front_min_m: 1.5, side_min_m: 3.50, rear_min_m: 3.50}
      - {storeys_max: 40,   front_min_m: 1.5, side_min_m: 4.50, rear_min_m: 4.50}
      - {storeys_max: null, front_min_m: 1.5, side_min_m: 5.00, rear_min_m: 5.00}

  # Table-8, car parking for A3 at a uniform flat size.
  #
  # `cars_per_unit` is the multiplier applied to the unit count. Mixed unit
  # sizes need the per-band unit mix, which this flat encoding does not carry
  # (same limitation the rule declares) — a forward consumer given a MIX must
  # emit "cannot evaluate". The gazette's 90/140/200 band edges overlap in the
  # source text; edges here follow the rule's reading.
  parking_by_flat_area:
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 53(5), Table-8 rows 1, 5-9"
    rule_id: RAJUK-PARKING-012
    verify_flag: true
    # No car parking is required at all when the front road is under 2.5 m
    # (Table-8 row 1) — this gate is checked before the slabs.
    no_parking_below_road_width_m: 2.50
    # flat_area_max_m2 inclusive; null = no upper bound.
    slabs:
      - {flat_area_max_m2: 60,   cars_per_unit: 0,       note: "motorcycle parking only"}
      - {flat_area_max_m2: 90,   cars_per_unit: 0.25,    note: "1 per 4 units"}
      - {flat_area_max_m2: 140,  cars_per_unit: 0.5,     note: "1 per 2 units"}
      - {flat_area_max_m2: 200,  cars_per_unit: 0.666667, note: "2 per 3 units"}
      - {flat_area_max_m2: null, cars_per_unit: 1.05,    note: "1 per flat + 5% guest"}
