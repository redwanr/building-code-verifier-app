    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 57(d)(2)"
    remediation: "Redesign the stair so each riser is at most 175 mm, each tread at least 225 mm, and riser + tread at least 400 mm."
    verify_flag: true
    display:
