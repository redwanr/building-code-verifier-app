  - id: RAJUK-ROOM-018
    title: "Other habitable rooms at least 5 m2 and 2 m wide (Bidhimala Rule 57(a))"
    parameters: [room_area_m2, room_width_m]
    logic: "room_area_m2 >= 5 and room_width_m >= 2"
    severity: Medium
    confidence_basis: "Verbatim Rule 57(a)(1) (page image, PDF p.72 / gazette p.13480): 'আবাসিক ভবনের প্রতিটি ইউনিটের ক্ষেত্রে ন্যূনতম ২.৯ মিটার প্রস্থ ও ৯.৫ বর্গমিটার ক্ষেত্রফল বিশিষ্ট অন্তত একটি কক্ষ থাকিতে হইবে এবং অন্যান্য বাসযোগ্য কক্ষসমূহের জন্য সর্বনিম্ন ক্ষেত্রফল ৫ বর্গমিটার এবং ন্যূনতম প্রস্থ ২ মিটার হইতে হইবে' (at least one room 9.5 m2 x 2.9 m per unit; other habitable rooms 5 m2 x 2 m). Checked against the smallest labelled habitable room. BNBC 1.14.2.2 sets 9.5 m2 / 2.9 m for ALL habitable rooms (BNBC-ROOM-007), so a room between 5 and 9.5 m2 passes this rule and fails the BNBC one; the expert decides which governs. The one-room 9.5 m2 clause is not a separate rule: the smallest-room read cannot show it, and BNBC-ROOM-007 already applies 9.5 m2 to every room. [VERIFY]"
    citation: "Imarat Nirman Bidhimala 2025 (gazette 2025-12-14) Rule 57(a)(1)"
    remediation: "Enlarge the room to at least 5 m2 and 2 m wide."
    verify_flag: true
    display:
      kind: compare
      fix_on: typical_floor
      headline_fail: "A habitable room is below the Bidhimala minimum"
      headline_pass: "Habitable rooms appear to meet the Bidhimala minimum"
      rows:
        - {found: room_area_m2, limit: 5, direction: min, action: "Enlarge the room by {gap} to at least {limit}."}
        - {found: room_width_m, limit: 2, direction: min, action: "Widen the room by {gap} to at least {limit}."}

